
<script>
document.addEventListener("DOMContentLoaded", function () {
  const nomeAntigo = "Sítio Vó Domingas e Vó Palmira";
  const nomeNovo = "Sítio Vó Domingas";

  // Atualiza as referências ao sítio antigo.
  document.querySelectorAll(
    "a, h2, p, strong, option"
  ).forEach(el => {
    if (el.children.length === 0 &&
        el.textContent.includes(nomeAntigo)) {
      el.textContent = el.textContent.replaceAll(
        nomeAntigo, nomeNovo
      );
    }
  });

  const sitio = document.getElementById("sitio");
  if (!sitio) return;

  // Mantém as cores e o estilo do site original.
  sitio.innerHTML = `
    <div class="wrap">
      <div class="section-head">
        <div>
          <div class="eyebrow">
            Conheça esse espaço
          </div>
          <h2>
            Venha conhecer o
            Sítio Vó Domingas
          </h2>
        </div>
      </div>

      <p style="max-width:650px;margin-bottom:25px">
        Um cantinho especial em meio à natureza,
        para reunir a família, os amigos e
        viver momentos inesquecíveis.
      </p>

      <h3>Conheça o Sítio Vó Domingas</h3>

      <p>
        Veja fotos reais e novidades do espaço
        no Instagram oficial.
      </p>

      <div style="display:flex;flex-wrap:wrap;
        gap:12px;margin:25px 0">

        <a class="btn btn-light"
          target="_blank"
          rel="noopener noreferrer"
          href="https://www.instagram.com/sitiovodomingas/">
          📸 Ver fotos no Instagram ↗
        </a>

        <a class="btn btn-outline"
          target="_blank"
          rel="noopener noreferrer"
          href="https://www.google.com/maps/search/?api=1&query=Sitio%20Vo%20Domingas%20Graciosa%20Biguacu%20SC">
          📍 Abrir GPS ↗
        </a>
      </div>

      <div style="margin-top:35px">
        <h3>Onde fica?</h3>
        <p>
          Estrada Geral da Graciosa<br>
          Graciosa, Biguaçu - SC<br>
          CEP 88169-899
        </p>

        <iframe
          title="Mapa do Sítio Vó Domingas"
          src="https://maps.google.com/maps?q=Sitio%20Vo%20Domingas%20Graciosa%20Biguacu%20SC&z=15&output=embed"
          width="100%"
          height="340"
          loading="lazy"
          style="border:0;border-radius:20px">
        </iframe>
      </div>
    </div>
  `;

  const opcao = document.querySelector(
    '#tipo option[value*="Vó Palmira"]'
  );
  if (opcao) {
    opcao.value = "Evento no Sítio Vó Domingas";
    opcao.textContent = "Evento no Sítio Vó Domingas";
  }

  const nota = document.getElementById(
    "partnerOriginNote"
  );
  if (nota) {
    nota.innerHTML =
      'Você veio pela indicação do ' +
      '<strong>Sítio Vó Domingas</strong>.';
  }
});
</script>
